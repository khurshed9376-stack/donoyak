{% extends "base.html" %}
{% block title %}Чат — Донояк TJ{% endblock %}
{% block content %}
<div class="container" style="max-width:900px;margin:0 auto;padding:12px;">
  <h2>Онлайн-чат</h2>
  <p style="color:var(--text-muted);font-size:.9rem;">Только администратор ↔ студент.</p>
  <div style="display:flex;gap:12px;flex-wrap:wrap;min-height:420px;">
    {% if is_admin %}
    <div id="peerList" style="flex:0 0 220px;background:var(--card-bg,#fff);border-radius:12px;padding:10px;max-height:480px;overflow:auto;">
      <div style="font-weight:600;margin-bottom:8px;">Студенты</div>
      <div id="peers"></div>
    </div>
    {% endif %}
    <div style="flex:1 1 280px;display:flex;flex-direction:column;background:var(--card-bg,#fff);border-radius:12px;padding:12px;min-height:400px;">
      <div id="chatHeader" style="font-weight:600;margin-bottom:8px;">{% if is_admin %}Выберите студента{% else %}Администратор{% endif %}</div>
      <div id="chatBox" style="flex:1;overflow-y:auto;border:1px solid var(--border,#e0e0e0);border-radius:8px;padding:10px;margin-bottom:10px;background:#fafafa;"></div>
      <div style="display:flex;gap:8px;">
        <input type="text" id="chatInput" placeholder="Сообщение..." style="flex:1;padding:10px;border-radius:8px;border:1px solid #ccc;" maxlength="2000">
        <button class="btn" id="chatSend" type="button">Отправить</button>
      </div>
    </div>
  </div>
</div>
<script>
(function(){
  const isAdmin = {{ is_admin|tojson }};
  let peerId = null;
  const box = document.getElementById('chatBox');
  const input = document.getElementById('chatInput');
  const header = document.getElementById('chatHeader');
  function esc(s){ const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }
  function loadPeers(){
    if (!isAdmin) return;
    fetch('/api/chat/peers').then(r=>r.json()).then(data=>{
      const el = document.getElementById('peers'); el.innerHTML = '';
      (data.peers||[]).forEach(p=>{
        const div = document.createElement('div');
        div.style.cssText = 'padding:8px;border-radius:8px;cursor:pointer;margin-bottom:4px;display:flex;align-items:center;gap:8px;';
        div.innerHTML = '<span style="width:10px;height:10px;border-radius:50%;background:'+(p.online?'#22c55e':'#9ca3af')+';"></span>'
          + '<span style="flex:1;">'+esc(p.name)+'</span>'
          + (p.unread? '<span style="background:#ef4444;color:#fff;border-radius:10px;padding:0 6px;font-size:.75rem;">'+p.unread+'</span>':'')
          + (p.in_exam? '<span style="font-size:.7rem;color:#f59e0b;">экзамен</span>':'');
        div.onclick = function(){ peerId = p.id; header.textContent = p.name + (p.online?' • онлайн':' • офлайн'); loadMsgs(); };
        el.appendChild(div);
      });
    }).catch(()=>{});
  }
  function loadMsgs(){
    let url = '/api/chat/messages';
    if (isAdmin) { if (!peerId) return; url += '?peer_id=' + peerId; }
    fetch(url).then(r=>r.json()).then(data=>{
      box.innerHTML = '';
      (data.messages||[]).forEach(m=>{
        const row = document.createElement('div');
        row.style.cssText = 'margin:6px 0;text-align:'+(m.mine?'right':'left')+';';
        row.innerHTML = '<span style="display:inline-block;padding:8px 12px;border-radius:12px;max-width:80%;background:'+(m.mine?'#1a5f7a':'#e5e7eb')+';color:'+(m.mine?'#fff':'#111')+';">'+esc(m.message)+'</span>'
          + '<div style="font-size:.7rem;color:#888;">'+esc((m.created_at||'').slice(0,16))+'</div>';
        box.appendChild(row);
      });
      box.scrollTop = box.scrollHeight;
    }).catch(()=>{});
  }
  document.getElementById('chatSend').onclick = function(){
    const msg = input.value.trim(); if (!msg) return;
    if (isAdmin && !peerId) { alert('Выберите студента'); return; }
    const body = {message: msg}; if (isAdmin) body.receiver_id = peerId;
    fetch('/api/chat/send', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)})
      .then(r=>r.json()).then(d=>{ if (d.ok) { input.value=''; loadMsgs(); } else alert(d.error||'Ошибка'); }).catch(()=>alert('Сеть'));
  };
  input.addEventListener('keydown', function(e){ if(e.key==='Enter') document.getElementById('chatSend').click(); });
  setInterval(function(){ fetch('/api/presence', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({in_exam:false})}).catch(()=>{}); }, 25000);
  fetch('/api/presence', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({in_exam:false})}).catch(()=>{});
  loadPeers(); if (!isAdmin) loadMsgs();
  setInterval(function(){ loadPeers(); loadMsgs(); }, 8000);
})();
</script>
{% endblock %}
